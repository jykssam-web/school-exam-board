name: 24/7 Render Keep-Alive Ping

on:
  schedule:
    # 10분마다 실행하여 Render의 15분 절전 모드를 사전 차단
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Render Server
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive HTTP Request
        run: |
          echo "Pinging https://school-exam-board.onrender.com/ping ..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://school-exam-board.onrender.com/ping || echo "000")
          echo "Response HTTP Status: $STATUS"
          if [ "$STATUS" -eq 200 ]; then
            echo "Server is awake and responding healthy!"
          else
            echo "Server response was $STATUS. Ping registered to reset idle timer."
          fi
